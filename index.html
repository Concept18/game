<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Clicker Game</h1>
        <p>Clicks: <span id="score">0</span></p>
        <p>Rebirths: <span id="rebirth-count">0</span></p>
        <button id="click-btn">Click Me!</button>
        <button id="upgrade-btn">Upgrade (Cost: 10)</button>
        <button id="auto-clicker-btn">Auto Clicker (Cost: 50)</button>
        <button id="rebirth-btn">Rebirth (Cost: 1000)</button>
        <button id="reset-btn">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
